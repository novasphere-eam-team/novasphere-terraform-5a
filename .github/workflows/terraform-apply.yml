name: terraform-apply

# push sur main : apply-dev puis apply-prod (protege par l'environnement "prod")
# workflow_dispatch / schedule : job de detection de derive uniquement
on:
  push:
    branches: [main]
    paths:
      - "envs/**"
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1-5"

permissions:
  id-token: write
  contents: read

concurrency:
  group: tf-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_owner: ${{ vars.TF_OWNER }}
  TF_VAR_aws_region: us-east-1
  TF_VAR_instance_type: t3.micro
  TF_VAR_ssh_public_key_path: ${{ github.workspace }}/ci_key.pub
  TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
  TF_VAR_generate_inventory: "false"
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
  apply-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    env:
      TF_VAR_environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false
      - run: git config --global url."https://x-access-token:${{ secrets.MODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > "${{ github.workspace }}/ci_key.pub"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Learner Lab : credentials de session (AWS_ACCESS_KEY_ID, ...) ; compte perso : AWS_ROLE_ARN (OIDC)
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - run: terraform init -input=false
      - name: plan (fichier)
        run: terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
      - name: apply du fichier de plan
        run: terraform apply -input=false -no-color -lock-timeout=120s tfplan

  apply-prod:
    if: github.event_name == 'push'
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: envs/prod
    env:
      TF_VAR_environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false
      - run: git config --global url."https://x-access-token:${{ secrets.MODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > "${{ github.workspace }}/ci_key.pub"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - run: terraform init -input=false
      - name: plan (fichier)
        run: terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
      - name: apply du fichier de plan
        run: terraform apply -input=false -no-color -lock-timeout=120s tfplan

  drift:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    env:
      TF_VAR_environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false
      - run: git config --global url."https://x-access-token:${{ secrets.MODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > "${{ github.workspace }}/ci_key.pub"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - run: terraform init -input=false
      - name: Detection de derive (plan -detailed-exitcode)
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::error::Derive detectee sur ${{ matrix.env }}"
            exit 1
          fi
          exit $code
