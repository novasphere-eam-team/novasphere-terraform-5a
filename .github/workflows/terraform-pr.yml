name: terraform-pr

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: tf-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_environment: ${{ matrix.env }}
      TF_VAR_owner: ${{ vars.TF_OWNER }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_instance_type: t3.micro
      TF_VAR_ssh_public_key_path: ${{ github.workspace }}/ci_key.pub
      TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
      TF_VAR_generate_inventory: "false"
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Acces au depot du module (prive)
        run: git config --global url."https://x-access-token:${{ secrets.MODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Cle SSH publique
        run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > "${{ github.workspace }}/ci_key.pub"

      - name: Authentification AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Mode OIDC : AWS_ROLE_ARN rempli, cles vides.
          # Mode secours Learner Lab : AWS_ROLE_ARN vide, cles de session remplies.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: .

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate -no-color

      - name: plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Commentaire du plan sur la PR
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(`envs/${process.env.ENV_NAME}/plan.txt`, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (tronque)';
            const body = `### Plan Terraform : \`${process.env.ENV_NAME}\`\n<details><summary>Afficher le plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
